:root{--navy:#ffffff;--gold:#d71920;--silver:#222222}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px;display:grid;place-items:center;background:linear-gradient(135deg,#ffffff 0%,#f3f3f3 100%);font-family:Arial,Helvetica,sans-serif;color:#222222}

.btn:hover{transform:translateY(-2px);background:#d7192012}.btn svg{width:18px;height:18px}
.separator{height:1px;background:linear-gradient(90deg,transparent,#d71920aa,transparent);margin:0 24px}
.brands{padding:23px 16px 20px;text-align:center}.brands h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d71920;margin:0 0 15px}
.brand-frame{background:#ffffff;border-radius:12px;overflow:hidden}.brand-image{display:block;width:100%;height:auto}.note{font-size:10px;opacity:.65;margin:12px 4px 0}.footer{text-align:center;padding:0 18px 20px;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;opacity:.65}
@media(max-width:380px){.top{padding:24px 15px}.btn{min-width:130px;flex:1}.brands{padding-left:10px;padding-right:10px}}
